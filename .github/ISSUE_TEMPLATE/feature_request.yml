name: Feature idea
description: Something that would make the job search or the interview practice better.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today? A real situation helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working.
  - type: checkboxes
    id: principles
    attributes:
      label: The project's principles
      options:
        - label: It keeps the data on the person's machine, with no account and no AI API called by the app on its own.
          required: true
        - label: It does not scrape LinkedIn or build profiles of real people (recruiters, interviewers).
          required: true
